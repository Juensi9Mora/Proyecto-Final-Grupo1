<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cancha - Registro</title>
    <link rel="shortcut icon" href="../img/mi_cancha_prototipo_logo.webp" type="image/x-icon">  
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inicio_sesion.css">
</head>

<body>

    <div id="navbar-root"></div>

    <main class="contenedor-autenticacion">
        <div class="tarjeta-login">
            <div class="circulo circulo-1" aria-hidden="true"></div>
            <div class="circulo circulo-2" aria-hidden="true"></div>
            <div class="circulo circulo-3" aria-hidden="true"></div>    

        <!-- FORMULARIO DE REGISTRO -->
        <section class="formulario" id="seccion-registro">
            <form id="formulario-registro" novalidate>
                <div class="encabezado-formulario">
                    <span class="etiqueta-formulario">ÚNETE A NOSOTROS</span>
                    <h2>Crear una cuenta</h2>
                    <p>Regístrate y comienza a reservar tus canchas deportivas.</p>
                </div>

                <fieldset class="fieldset">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre completo">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel" id="telefono" placeholder="Ejemplo: 300 123 4444">
                    <label for="correo-registro">Correo electrónico</label>
                    <input type="email" id="correo-registro" placeholder="Ingresa tu correo">
                    <label for="contrasena-registro">Contraseña</label>
                    <input type="password" id="contrasena-registro" placeholder="Ingresa tu contraseña">
                    <label for="confirmar-contrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmar-contrasena" placeholder="Confirma tu contraseña">
                     <p class="mensaje" id="mensaje-registro" role="alert"></p>
                    <button type="submit">Crear cuenta</button>
                </fieldset>

                <div class="enlaces-formulario">
                      <p>¿Ya tienes una cuenta? <a href="inicio_sesion.html" id="ir-login">Iniciar sesión</a></p>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/usuarios/validaciones-registro.js"></script>
    </body>

</html>
