<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cancha - Inicio de Sesión</title>
    <link rel="shortcut icon" href="../img/mi_cancha_prototipo_logo.webp" type="image/x-icon">
    <!-- style.css trae colores, navbar y footer; debe cargarse antes que inicio_sesion.css -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inicio_sesion.css">
</head>

<body>

    <!-- Navbar (misma que las demás páginas) -->
    <div id="navbar-root"></div>

    <main class="contenedor-autenticacion">
        <div class="tarjeta-login">

            <!-- Círculos decorativos que se ven detrás del formulario -->
            <div class="circulo circulo-1" aria-hidden="true"></div>
            <div class="circulo circulo-2" aria-hidden="true"></div>
            <div class="circulo circulo-3" aria-hidden="true"></div>

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <section class="formulario" id="seccion-login">
                <form id="formulario-login">
                    <div class="encabezado-formulario">
                        <span class="etiqueta-formulario">BIENVENIDO DE NUEVO</span>
                        <h2>Iniciar sesión</h2>
                        <p>Ingresa tus datos para continuar reservando.</p>
                    </div>

                    <fieldset class="fieldset">
                        <label for="correo-login">Correo electrónico</label>
                        <input type="email" id="correo-login" placeholder="Ingresa tu correo">

                        <label for="contrasena-login">Contraseña</label>
                        <input type="password" id="contrasena-login" placeholder="Ingresa tu contraseña">

                        <p class="olvido"><a href="restablece_contrasena.html" id="ir-restablecer">¿Olvidaste tu contraseña?</a></p>

                        <button type="submit">Iniciar sesión</button>
                    </fieldset>

                    <div class="enlaces-formulario">
                        <p>¿No tienes una cuenta? <a href="registro.html" id="ir-registro">Registrarse</a></p>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <div id="footer-root"></div>

    <!-- main.js controla el menú hamburguesa y el scroll de la navbar -->
    <script type="module" src="../js/main.js"></script>
</body>

</html>
