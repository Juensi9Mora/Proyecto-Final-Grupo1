<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/mi_cancha_prototipo_logo.webp" type="image/x-icon">
    <title>Dashboard administrador</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/panel_admin.css">
</head>

<body>

    <!-- Navbar Principal Fijo -->
    <div id="navbar-root"></div>

        <div class="hero-nosotros-admin">
    <section class="hero-titulo-admin">
        <h1>Panel <span>administrador</span></h1>
    </section>
    </div>

    <main class="contenedor">
        <h2 class="inicio-registro">Registrar cancha</h2>

        <form action="" id="formulario-inicial">
            <label for="nombre-inicial">Nombre Cancha</label>
            <input type="text" id="nombre-inicial" name="nombre-inicial" required>
            <button type="submit">Crear Cancha</button>
        </form>

        <section id="seccion-detalles" hidden>
            <h2 id="titulo-detalles">Información de la cancha</h2>
            <form action="" id="formulario-detalles" novalidate>
                <label for="nombre-cancha">Nombre</label>
                <input type="text" id="nombre-cancha" name="nombre-cancha" required>

                <label for="imagen">Imagen de la cancha</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
                <img id="vista-imagen" alt="Vista previa de la cancha" hidden>

                <label for="balon">Imagen del deporte (reverso de la tarjeta)</label>
                <input type="file" id="balon" name="balon" accept="image/*">
                <img id="vista-balon" alt="Vista previa de la imagen del deporte" hidden>

                <label for="detalle">Descripción (reverso de la tarjeta)</label>
                <textarea id="detalle" name="detalle" rows="3" maxlength="250"
                    placeholder="Describe la cancha y sus características"></textarea>

                <label for="pais">País</label>
                <select id="pais" name="pais" required>
                    <option value="">Selecciona un Pais</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Peru">Perú</option>
                </select>

                <label for="ciudad">Ciudad</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="">Selecciona una ciudad</option>
                </select>

                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una categoría</option>
                </select>

                <div id="contenedor-subcategoria" hidden>
                    <label for="subcategoria">Subcategoría</label>
                    <select id="subcategoria" name="subcategoria" disabled>
                        <option value="">Selecciona una subcategoría</option>
                        <option value="Fútbol 5">Fútbol 5</option>
                        <option value="Fútbol 7">Fútbol 7</option>
                        <option value="Fútbol 8">Fútbol 8</option>
                        <option value="Fútbol 11">Fútbol 11</option>
                    </select>
                </div>

                <label for="moneda">Moneda</label>
                <select id="moneda" name="moneda" required disabled>
                    <option value="">Se asigna según el país</option>
                    <option value="COP">COP</option>
                    <option value="PEN">PEN</option>
                </select>

                <label for="valor">Valor por hora</label>
                <input type="number" id="valor" name="valor" required>

                <button type="submit" id="guardar">Guardar</button>
                <button type="button" id="cancelar">Cancelar</button>
            </form>
        </section>

        <h2 class="subtituloCanchaRegistrada">Canchas registradas</h2>
        <div id="registrar_cancha"></div>
    </main>



    <div id="footer-root"></div>

    <script type="module" src="../js/admin/app.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>

</html>
